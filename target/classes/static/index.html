<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eagle Share | GSU Food Rescue</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ================= LOGIN OVERLAY ================= -->
    <div id="login-overlay">
        <div class="post-panel" style="text-align: center; width: 360px;">
            <h1 style="color: var(--gsu-blue); margin: 0 0 5px 0;">🦅 Eagle Share</h1>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">GSU Food Rescue</p>

            <input type="email" id="email-input" placeholder="GSU Email (@georgiasouthern.edu)">
            <input type="password" id="pass-input" placeholder="Password">

            <button class="primary-btn" onclick="handleLogin()">Log In</button>

            <button style="background:none; border:none; color:var(--gsu-gold); margin-top:15px; cursor:pointer;"
                onclick="handleRegister()">Create Account</button>
        </div>
    </div>

    <!-- ================= MAIN CONTENT ================= -->
    <div id="main-content" style="display:none;">

        <div class="header">
            <div>
                <a class="logo" href='index.html'>EAGLE SHARE</a>
            </div>

            <div class="profile-section">
                <div class="profile-circle" id="user-initial" onclick="toggleMenu(event)">U</div>

                <div class="dropdown-menu" id="profileMenu">
                    <div id="user-email-display" style="padding: 5px 12px; font-size: 11px; color: #64748b;"></div>

                    <button class="menu-item" onclick="openActivity()">📋 My Activity</button>
                    <button class="menu-item menu-logout" onclick="logout()">🚪 Log Out</button>
                </div>
            </div>
        </div>

        <div class="main-wrapper">

            <!-- ===== LISTINGS PANEL ===== -->
            <div class="listings-panel">
                <h2>Available Now</h2>

                <div class="filters">
                    <select id="filterCategory" onchange="renderFeed()">
                        <option value="">All Categories</option>
                        <option value="Frozen Goods">Frozen Goods</option>
                        <option value="Perishable">Perishable</option>
                        <option value="Canned">Canned</option>
                    </select>

                    <select id="filterLocation" onchange="renderFeed()">
                        <option value="">All Locations</option>
                        <option value="The RAC">The RAC</option>
                        <option value="Russell Union">Russell Union</option>
                        <option value="Henderson Library">Henderson Library</option>
                    </select>
                </div>

                <div id="food-feed" class="cards-grid"></div>
            </div>
        </div>

    </div>
    <div class="toolbar" style="display: none;">
        <div class="profile-section">
                <div class="post-button" id="user-initial" onclick="window.location.href='post_food.html'"></div>
            </div>
    </div>
    </div>

    <!-- ===== ACTIVITY MODAL ===== -->
    <div id="activityModal" class="modal-overlay">
        <div style="background:white;
                width:90%;
                max-width:500px;
                border-radius:16px;
                padding:25px;
                box-shadow:0 20px 50px rgba(0,0,0,0.2);
                max-height:80vh;
                overflow-y:auto;">

            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0;">My Activity</h3>
                <button onclick="closeActivity()"
                    style="background:none;border:none;font-size:18px;cursor:pointer;">✖</button>
            </div>

            <div id="claimsList" style="margin-top:20px;"></div>
            <div id="postsList" style="margin-top:20px;"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
