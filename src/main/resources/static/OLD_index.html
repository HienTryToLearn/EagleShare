<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eagle Share | GSU Food Rescue</title>

    <style>
    </style>
</head>

<body>

<!-- ================= LOGIN OVERLAY ================= -->
<div id="login-overlay">
    <div class="post-panel" style="text-align: center; width: 360px;">
        <h1 style="color: var(--gsu-blue); margin: 0 0 5px 0;">🦅 Eagle Share</h1>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">GSU Food Rescue</p>

        <input type="email" id="email-input" placeholder="GSU Email (@georgiasouthern.edu)">
        <input type="password" id="pass-input" placeholder="Password">

        <button class="primary-btn" onclick="handleLogin()">Log In</button>

        <button style="background:none; border:none; color:var(--gsu-gold); margin-top:15px; cursor:pointer;"
                onclick="handleRegister()">Create Account</button>
    </div>
</div>

<!-- ================= MAIN CONTENT ================= -->
<div id="main-content" style="display:none;">

    <div class="header">
        <div class="logo">EAGLE SHARE</div>

        <div class="profile-section">
            <div class="profile-circle" id="user-initial" onclick="toggleMenu(event)">U</div>

            <div class="dropdown-menu" id="profileMenu">
                <div id="user-email-display"
                     style="padding: 5px 12px; font-size: 11px; color: #64748b;"></div>

                <button class="menu-item" onclick="openActivity()">📋 My Activity</button>
                <button class="menu-item menu-logout" onclick="logout()">🚪 Log Out</button>
            </div>
        </div>
    </div>

    <div class="main-wrapper">

        <!-- ===== LISTINGS PANEL ===== -->
        <div class="listings-panel">
            <h2>Available Now</h2>

            <div class="filters">
                <select id="filterCategory" onchange="renderFeed()">
                    <option value="">All Categories</option>
                    <option value="Frozen Goods">Frozen Goods</option>
                    <option value="Perishable">Perishable</option>
                    <option value="Canned">Canned</option>
                </select>

                <select id="filterLocation" onchange="renderFeed()">
                    <option value="">All Locations</option>
                    <option value="The RAC">The RAC</option>
                    <option value="Russell Union">Russell Union</option>
                    <option value="Henderson Library">Henderson Library</option>
                </select>
            </div>

            <div id="food-feed" class="cards-grid"></div>
        </div>

    </div>
</div>

<!-- ===== ACTIVITY MODAL ===== -->
<div id="activityModal" class="modal-overlay">
    <div style="background:white;
                width:90%;
                max-width:500px;
                border-radius:16px;
                padding:25px;
                box-shadow:0 20px 50px rgba(0,0,0,0.2);
                max-height:80vh;
                overflow-y:auto;">

        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0;">My Activity</h3>
            <button onclick="closeActivity()"
                    style="background:none;border:none;font-size:18px;cursor:pointer;">✖</button>
        </div>

        <div id="claimsList" style="margin-top:20px;"></div>
        <div id="postsList" style="margin-top:20px;"></div>
    </div>
</div>

<!-- ================= JAVASCRIPT ================= -->
<script>

    let allItems = [];

    /* ================= AUTH ================= */

    async function handleLogin() {
        const email = document.getElementById('email-input').value.toLowerCase();
        const password = document.getElementById('pass-input').value;

        const res = await fetch('/api/users/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        if (res.ok) {
            const user = await res.json();
            localStorage.setItem('userEmail', user.email);
            showDashboard();
        } else {
            alert("Login failed.");
        }
    }

    async function handleRegister() {
        const email = document.getElementById('email-input').value.toLowerCase();
        const password = document.getElementById('pass-input').value;

        if (!email.endsWith("@georgiasouthern.edu")) {
            alert("GSU email only!");
            return;
        }

        const res = await fetch('/api/users/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        if (res.ok) {
            alert("Account created! Log in now.");
        }
    }

    function showDashboard() {
        const email = localStorage.getItem('userEmail');
        if (!email) return;

        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        document.getElementById('user-initial').innerText =
            email.charAt(0).toUpperCase();
        document.getElementById('user-email-display').innerText = email;

        refreshFeed();
    }

    /* ================= MENU ================= */

    function toggleMenu(e) {
        e.stopPropagation();
        document.getElementById('profileMenu').classList.toggle('active');
    }

    window.onclick = () =>
        document.getElementById('profileMenu').classList.remove('active');

    function logout() {
        localStorage.clear();
        location.reload();
    }

    /* ================= POSTING ================= */

    async function handlePost(e) {
        e.preventDefault();

        const formData = new FormData();
        formData.append("title", document.getElementById('title').value);
        formData.append("description", document.getElementById('description').value);
        formData.append("category", document.getElementById('category').value);
        formData.append("location", document.getElementById('location').value);
        formData.append("posterEmail", localStorage.getItem('userEmail'));

        const imageFile = document.getElementById('image').files[0];
        if (imageFile) formData.append("image", imageFile);

        const response = await fetch('/api/listings', {
            method: 'POST',
            body: formData
        });

        if (response.ok) {
            document.getElementById('postForm').reset();
            document.getElementById("imagePreviewContainer").style.display = "none";

            const fileName = document.getElementById("fileName");
            if (fileName) fileName.textContent = "No file selected";

            refreshFeed();
        } else {
            console.error("Failed to post item");
        }
    }

    /* ================= FEED ================= */

    async function refreshFeed() {
        const res = await fetch('/api/listings');
        allItems = await res.json();
        renderFeed();
    }

    function renderFeed() {
        const feed = document.getElementById('food-feed');
        const cat = document.getElementById('filterCategory').value;
        const loc = document.getElementById('filterLocation').value;
        const currentUser = localStorage.getItem('userEmail');

        const filtered = allItems.filter(i =>
            i.status === 'AVAILABLE' &&
            (cat === "" || i.category === cat) &&
            (loc === "" || i.location === loc)
        );

        feed.innerHTML = filtered.map(item => `
            <div class="food-card">
                ${item.imageBase64
                    ? `<img src="data:image/jpeg;base64,${item.imageBase64}">`
                    : ''}

                <div class="food-category">${item.category}</div>
                <h4>${item.title}</h4>
                <div class="desc">${item.description}</div>
                <div class="food-location">📍 ${item.location}</div>

                ${item.posterEmail === currentUser
                    ? `<button class="claim-btn"
                              style="background:#fee2e2; color:#dc2626;"
                              onclick="deletePost(${item.id})">
                          Delete Post
                       </button>`
                    : `<button class="claim-btn active"
                              onclick="claim(${item.id})">
                          Claim
                       </button>`
                }
            </div>
        `).join('');
    }

    async function claim(id) {
    const email = localStorage.getItem('userEmail');

    const res = await fetch(`/api/listings/${id}/claim`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ email: email })
    });

        if (res.ok) {
            refreshFeed();
        } else {
            const errorText = await res.text();
            alert(errorText);
        }
    }

    async function deletePost(id) {
        const reason = prompt("Reason for deleting:");
        if (reason === null) return;

        const res = await fetch(`/api/listings/${id}/delete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userEmail: localStorage.getItem('userEmail'),
                reason: reason || "No reason provided"
            })
        });

        if (res.ok) {
            refreshFeed();
        } else {
            alert("Failed to delete post.");
        }
    }

    /* ================= ACTIVITY ================= */

    function openActivity() {
        const currentUser = localStorage.getItem('userEmail');

        const myClaims = allItems.filter(i => i.claimedBy === currentUser);
        const myPosts = allItems.filter(i => i.posterEmail === currentUser);

        document.getElementById('claimsList').innerHTML =
            "<h4>Items I Claimed</h4>" +
            (myClaims.length
                ? myClaims.map(i =>
                    `<p>✅ <strong>${i.title}</strong><br>
                     📍 ${i.location}</p>`
                ).join("")
                : "<p style='color:#64748b;'>None</p>");

        document.getElementById('postsList').innerHTML =
            "<h4>My Posts</h4>" +
            (myPosts.length
                ? myPosts.map(i =>
                    `<p>
                        📦 <strong>${i.title}</strong><br>
                        Status: <b>${i.status}</b>
                        ${i.claimedBy
                            ? `<br><small style="color:#0f172a;">
                                 Claimed by: ${i.claimedBy}
                               </small>`
                            : ""}
                    </p>`
                ).join("")
                : "<p style='color:#64748b;'>None</p>");

        document.getElementById('activityModal')
            .classList.add('active');
    }

    function closeActivity() {
        document.getElementById('activityModal')
            .classList.remove('active');
    }

    /* ================= IMAGE PREVIEW ================= */

    function previewImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById("fileName").textContent = file.name;

        const reader = new FileReader();
        reader.onload = function (e) {
            document.getElementById("imagePreview").src = e.target.result;
            document.getElementById("imagePreviewContainer").style.display = "block";
        };
        reader.readAsDataURL(file);
    }

    /* ================= AUTO INIT ================= */

    if (localStorage.getItem('userEmail')) showDashboard();
    setInterval(refreshFeed, 5000);

</script>
</body>
</html>
